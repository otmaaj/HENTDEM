<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HENTDEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- Плашка проверки возраста 18+ (Адаптивная, кнопки по стилю оригинала) -->
<div id="age-gate-overlay" class="age-gate-wrapper" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; background: rgba(10, 10, 12, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 9999999; display: flex !important; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; overflow: hidden;">
  <div class="age-gate-box" style="background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 35px 20px; max-width: 440px; width: 92%; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); color: #fff; font-family: sans-serif; box-sizing: border-box;">
    
    <!-- Твой логотип из папки static -->
    <div class="age-gate-logo" style="margin-bottom: 25px; display: flex; justify-content: center;">
      <img src="/static/photo_2026-05-23_18-39-02.png" alt="HENTDEM" style="max-width: 200px; width: 100%; height: auto;">
    </div>

    <h2 style="font-size: 24px; margin-top: 0; margin-bottom: 12px; font-weight: bold; color: #fff;">Это сайт для взрослых</h2>
    
    <p class="age-gate-text" style="font-size: 14px; line-height: 1.5; color: #e0e0e6; margin-bottom: 30px; padding: 0 5px; margin-top: 0;">
      Данный сайт содержит материалы с возрастными ограничениями, включая обнаженные части тела и откровенные сцены сексуального характера. Входя на сайт, вы подтверждаете, что вам исполнилось 18 лет.
    </p>
    
    <!-- Блок кнопок -->
    <div class="age-gate-buttons" style="display: flex; flex-direction: column; gap: 16px; width: 100%;">
      
      <!-- Кнопка Вход: Темный фон, толстая ЖЕЛТАЯ рамка, белый текст -->
      <button id="age-gate-accept" style="width: 100%; padding: 16px; font-size: 18px; font-weight: bold; background: #1b1b1b !important; color: #ffffff !important; border: 3px solid #d6e000 !important; border-radius: 8px !important; cursor: pointer; text-align: center; box-sizing: border-box; transition: background-color 0.15s ease;">Мне 18 лет и более - Вход</button>
      
      <!-- Кнопка Выход: Темный фон, толстая ОРАНЖЕВАЯ рамка, белый текст -->
      <button id="age-gate-reject" style="width: 100%; padding: 16px; font-size: 18px; font-weight: bold; background: #1b1b1b !important; color: #ffffff !important; border: 3px solid #ff9900 !important; border-radius: 8px !important; cursor: pointer; text-align: center; box-sizing: border-box; transition: background-color 0.15s ease;">Мне нет 18 лет - Выход</button>
    
    </div>
  </div>
</div>

<header>
  <div class="logo" onclick="closeReader(); closeFav();">
    <div class="logo-icon">
      <!-- Здесь путь тоже проверен и исправлен -->
      <img src="/static/photo_2026-05-23_18-39-02.png" alt="logo">
    </div>
    <div class="logo-text">HENT<span>DEM</span></div>
  </div>

  <input type="text" style="display:none" name="fake-user">
  <input type="password" style="display:none" name="fake-pass">
  <div class="search-box">
    <input type="text" id="search" placeholder="Поиск..." autocomplete="new-password" name="manga-search">
    <div class="search-icon" onclick="doSearch()">⌕</div>
  </div>

  <div class="profile-wrap">
    <button class="profile-btn" id="profile-btn" onclick="toggleDropdown()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      <div class="profile-name-badge" id="profile-badge"></div>
    </button>

    <div class="profile-dropdown" id="profile-dropdown">
      <div id="auth-panel">
        <div class="dropdown-header">Account</div>
        <div class="dropdown-tabs">
          <button class="dtab active" onclick="switchTab('login')">Вход</button>
          <button class="dtab" onclick="switchTab('reg')">Регистрация</button>
        </div>
        <div class="dropdown-form" id="login-form">
          <input class="dinput" id="l-name" placeholder="Имя пользователя" autocomplete="off">
          <input class="dinput" id="l-pass" placeholder="Пароль" type="password" autocomplete="off">
          <div class="dmsg" id="l-msg"></div>
          <button class="dsubmit" onclick="doLogin()">Войти</button>
        </div>
        <div class="dropdown-form" id="reg-form" style="display:none">
          <input class="dinput" id="r-name" placeholder="Имя пользователя" autocomplete="off">
          <input class="dinput" id="r-pass" placeholder="Пароль" autocomplete="off">
          <div class="dmsg" id="r-msg"></div>
          <button class="dsubmit" onclick="doRegister()">Зарегистрироваться</button>
        </div>
      </div>
      <div id="logged-panel" style="display:none">
        <div class="logged-info">
          <div class="logged-username" id="logged-name"></div>
          <div class="logged-sub">вы вошли в аккаунт</div>
        </div>
        <button class="dfav-btn" onclick="openFav()">♥ Избранное</button>
        <button class="dlogout" onclick="doLogout()">Выйти</button>
      </div>
    </div>
  </div>
</header>

<div class="genre-bar" id="genre-bar">
  <button class="genre-btn active" data-genre="all" onclick="setGenre(this,'all')">Все</button>
</div>

<div class="container">
  <div class="results-info" id="results-info"></div>
  <div class="card-list" id="card-list">
    <div class="loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
</div>

<div id="reader">
  <div class="reader-header">
    <div class="reader-title" id="reader-title">—</div>
    <div class="reader-count" id="reader-count"></div>
    <button class="close-btn" onclick="closeReader()">✕ Закрыть</button>
  </div>
  <div id="pages-wrap"></div>
</div>

<div id="fav-overlay">
  <div class="fav-header">
    <div class="fav-title">♥ Избранное</div>
    <button class="close-btn" onclick="closeFav()">✕ Закрыть</button>
  </div>
  <div class="fav-body">
    <div class="card-list" id="fav-list"></div>
  </div>
</div>

<button id="totop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="toast" id="toast"></div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('search').value = '';
  });
</script>

<script src="/static/js/reader.js"></script>
</body>
</html>
